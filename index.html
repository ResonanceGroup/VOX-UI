<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Moved buttons to top of screen, centered -->
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px; padding: 10px;">
            <div style="display: flex; gap: 5px;">
                <button onclick="document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark')">Toggle Theme</button>
                <button style="padding: 2px 5px; font-size: 0.75rem;" onclick="updateUIState('idle')">Idle</button>
                <button style="padding: 2px 5px; font-size: 0.75rem;" onclick="updateUIState('executing', 'Test Tool')">Exec</button>
                <button style="padding: 2px 5px; font-size: 0.75rem;" onclick="updateUIState('processing')">Proc</button>
                <button style="padding: 2px 5px; font-size: 0.75rem;" onclick="updateUIState('notifying', 'Test Notification')">Notify</button>
                <button style="padding: 2px 5px; font-size: 0.75rem;" onclick="updateUIState('muted')">Mute</button>
                <button style="padding: 2px 5px; font-size: 0.75rem;" onclick="updateUIState('disconnected')">Disc</button>
            </div>
            <div style="display: flex; align-items: center; gap: 5px;">
                <label for="audioLevel" style="font-size: 0.8rem;">Audio Level:</label>
                <input type="range" id="audioLevel" min="0" max="1" step="0.01" value="0"
                       style="width: 150px;"
                       oninput="simulateAudioLevel(this.value)">
                <span id="audioLevelValue" style="font-size: 0.75rem; min-width: 40px;">0.00</span>
            </div>
        </div>
        
        <main class="chat-main">
            <div class="orb-container">
                        <div class="orb">
                            <div class="orb-status-effects">
                                <div class="orb-status-ring"></div>
                                <div class="orb-particles"></div>
                            </div>
                            <div class="wrap">
                                <div class="c"></div>
                                <div class="c"></div>
                                <div class="c"></div>
                            </div>
                        </div>
                        <div id="status-display" class="status-display">
                            <span class="status-icon"></span>
                            <span class="status-text">Ready to assist...</span>
                        </div>
                    </div>
                </div>
                
            </div>
        </main>

    </div>
    <script src="main.js"></script>
    <script>

        // --- Global Scope for Status Logic ---
        let currentAIState = 'idle'; // Initial state
        let underlyingAIState = 'idle'; // State before mute
        const ALL_STATES = ['idle', 'executing', 'notifying', 'processing', 'muted', 'disconnected'];
        
        // Declare globally, assign inside DOMContentLoaded
        let statusIcon = null;
        let statusText = null;
        let orbElement = null;
        let orbParticles = null;

        // Create particles for notification effect
        function createParticles() {
            if (!orbParticles) return;
            
            // Clear any existing particles
            orbParticles.innerHTML = '';
            
            // Create 5-7 particles
            const particleCount = Math.floor(Math.random() * 3) + 7; // Increased minimum to 7
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random angle for trajectory
                const angle = Math.random() * Math.PI * 2;
                // Random distance (40-100px) - increased for better visibility
                const distance = 40 + Math.random() * 60;
                
                // Calculate x,y destination based on angle and distance
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;
                
                // Set random color from options - brighter colors
                const colors = ['#42A5F5', '#64B5F6', '#29B6F6', '#03A9F4', '#00BCD4'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                // Apply styles
                particle.style.setProperty('--x', `${x}px`);
                particle.style.setProperty('--y', `${y}px`);
                particle.style.backgroundColor = color;
                
                // Larger particles (8-16px)
                const size = 8 + Math.random() * 8;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Slightly longer animation (500-700ms)
                const duration = 500 + Math.random() * 200;
                particle.style.animation = `particle-burst ${duration}ms forwards ease-out`;
                
                // Add to container
                orbParticles.appendChild(particle);
            }
            // Create a flash effect on the orb for notification emphasis
            const flash = document.createElement('div');
            flash.className = 'notification-flash';
            flash.style.position = 'absolute';
            flash.style.inset = '0';
            flash.style.backgroundColor = 'rgba(100, 181, 246, 0.3)';
            flash.style.borderRadius = '50%';
            flash.style.animation = 'fade-out 400ms forwards';
            orbParticles.appendChild(flash);
            
            // Create expanding wave effect
            const wave = document.createElement('div');
            wave.className = 'notification-wave';
            wave.style.position = 'absolute';
            wave.style.top = '50%';
            wave.style.left = '50%';
            wave.style.transform = 'translate(-50%, -50%)';
            wave.style.width = '100%';
            wave.style.height = '100%';
            wave.style.borderRadius = '50%';
            wave.style.border = '3px solid rgba(100, 181, 246, 0.8)';
            wave.style.boxShadow = '0 0 15px rgba(100, 181, 246, 0.6)';
            wave.style.animation = 'expand-wave 1s forwards ease-out';
            orbParticles.appendChild(wave);
            // No need to append flash again - it was already appended at line 167
        }
        
        // Add keyframes for notification animations
        if (!document.querySelector('#notification-keyframes')) {
            const style = document.createElement('style');
            style.id = 'notification-keyframes';
            style.textContent = `
                @keyframes fade-out {
                    from { opacity: 1; }
                    to { opacity: 0; }
                }
                
                @keyframes expand-wave {
                    0% {
                        width: 100%;
                        height: 100%;
                        opacity: 0.8;
                    }
                    100% {
                        width: 200%;
                        height: 200%;
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        }
        
        // Add transition flash effect between states
        function triggerTransitionEffect() {
            if (!orbElement) return;
            
            // Add transitioning class
            document.body.classList.add('transitioning');
            
            // Remove it after animation completes
            setTimeout(() => {
                document.body.classList.remove('transitioning');
            }, 150);
        }

        function updateUIState(newState, detail = '') {
            if (!ALL_STATES.includes(newState)) {
                console.warn('Invalid AI state provided:', newState);
                return;
            }

            // If we're changing states (not just updating detail), trigger transition
            if (newState !== currentAIState) {
                triggerTransitionEffect();
            }

            console.log(`Updating UI State: ${newState}, Detail: ${detail}`);

            // --- Manage State Classes on Body ---
            ALL_STATES.forEach(state => document.body.classList.remove(`state-${state}`));
            document.body.classList.add(`state-${newState}`);
            
            // Store the state before mute if not already muted
            if (newState === 'muted' && currentAIState !== 'muted') {
                underlyingAIState = currentAIState === 'muted' ? 'idle' : currentAIState; // Avoid storing 'muted' itself
            }
            
            // Save previous state for comparing changes
            const previousState = currentAIState;
            currentAIState = newState;

            // --- Update Status Bar ---
            // Ensure elements exist before updating (they should after DOMContentLoaded)
            if (!statusIcon || !statusText) {
                // Don't log error here, might be called before DOM ready on initial load
                // console.error('Status icon or text element not found!');
                return;
            }
            
            let iconContent = '●';
            let textContent = 'Ready to assist...';

            switch (newState) {
                case 'idle':
                    iconContent = '●'; // Or '✓'
                    textContent = 'Ready to assist...';
                    
                    // Clear any existing processing container
                    const idleExistingContainer = document.querySelector('.processing-container');
                    if (idleExistingContainer) {
                        idleExistingContainer.remove();
                    }
                    break;
                case 'executing':
                    iconContent = '⚙️';
                    textContent = `Executing: ${detail || 'Task'}...`;
                    
                    // Clear any existing processing container
                    const execExistingContainer = document.querySelector('.processing-container');
                    if (execExistingContainer) {
                        execExistingContainer.remove();
                    }
                    break;
                case 'processing':
                    iconContent = ''; // Empty icon for processing state to avoid conflict with dots
                    
                    // Base text for processing (can be overridden with detail)
                    const baseText = detail || 'Processing';
                    
                    // Set the text content but use container structure to prevent text movement
                    textContent = ''; // Clear existing text
                    
                    // Create a structured container for processing status with fixed positioning
                    setTimeout(() => {
                        // Remove any existing ellipsis container to prevent duplicates
                        const existingContainer = document.querySelector('.processing-container');
                        if (existingContainer) {
                            existingContainer.remove();
                        }
                        
                        // Clear the current text and add only the processing state
                        statusText.textContent = '';
                        
                        // Create container for just the text (no dots before)
                        const container = document.createElement('div');
                        container.className = 'processing-container';

                        // Create the text span (no dots in the content)
                        const baseTextSpan = document.createElement('span');
                        baseTextSpan.className = 'processing-text';
                        baseTextSpan.textContent = baseText;
                        
                        // Create dots span that will appear after the text
                        const ellipsis = document.createElement('span');
                        ellipsis.className = 'ellipsis-dots';
                        
                        // Add text first, then dots to ensure correct order
                        container.appendChild(baseTextSpan);
                        container.appendChild(ellipsis);
                        
                        // Add the complete container to the status display
                        statusText.appendChild(container);
                        
                        // Create processing status styles if they don't exist
                        if (!document.querySelector('#processing-styles')) {
                            const style = document.createElement('style');
                            style.id = 'processing-styles';
                            style.textContent = `
                                .processing-container {
                                    display: inline-flex;
                                    justify-content: center;
                                    align-items: center;
                                }
                                
                                .processing-text {
                                    display: inline;
                                    white-space: nowrap;
                                }
                                
                                .ellipsis-dots {
                                    display: inline-block;
                                    width: 18px;
                                    text-align: left;
                                    overflow: hidden;
                                }
                                
                                .ellipsis-dots::after {
                                    content: '.';
                                    display: inline-block;
                                    margin-left: 2px;  /* Space between text and dots */
                                    animation: ellipsis-animation 2s infinite;
                                }
                                
                                @keyframes ellipsis-animation {
                                    0% { content: '.'; }
                                    20% { content: '..'; }
                                    40% { content: '...'; }
                                    60% { content: '....'; }
                                    80%, 100% { content: '.'; }
                                }
                            `;
                            document.head.appendChild(style);
                        }
                    }, 10);
                    break;
                case 'notifying':
                    iconContent = '🔔';
                    textContent = detail || 'Notification Received';
                    
                    // First clear any existing processing container
                    const existingContainer = document.querySelector('.processing-container');
                    if (existingContainer) {
                        existingContainer.remove();
                    }
                    
                    // Manually clear existing particles to ensure clean state
                    if (orbParticles) {
                        orbParticles.innerHTML = ''; // Clear before creating new particles
                    }
                    
                    // Create particle effect with slight delay to ensure DOM is ready, but only once
                    const notifyTimer = setTimeout(() => createParticles(), 10);
                    
                    // Revert state after a longer delay to show the full effect
                    setTimeout(() => {
                        // Only revert if still in notifying state (user might have changed it)
                        if (currentAIState === 'notifying') {
                            clearTimeout(notifyTimer); // Clear the timer in case it hasn't fired
                            updateUIState(underlyingAIState || 'idle');
                        }
                    }, 2500);
                    break;
                case 'muted':
                    iconContent = '🎙️🚫';
                    textContent = 'Microphone Muted';
                    
                    // Clear any existing processing container
                    const mutedExistingContainer = document.querySelector('.processing-container');
                    if (mutedExistingContainer) {
                        mutedExistingContainer.remove();
                    }
                    break;
                case 'disconnected':
                    iconContent = '❌';
                    textContent = 'Disconnected';
                    
                    // Clear any existing processing container
                    const discExistingContainer = document.querySelector('.processing-container');
                    if (discExistingContainer) {
                        discExistingContainer.remove();
                    }
                    break;
            }

            // Global cleanup for old animated ellipsis elements (legacy code)
            const legacyEllipsis = document.querySelector('.animated-ellipsis');
            if (legacyEllipsis) {
                legacyEllipsis.remove();
            }

            // Don't set the icon text content - let CSS pseudo-elements handle this
            // instead of duplicating the icon in the DOM
            // statusIcon.textContent = iconContent;
            statusText.textContent = textContent;

            console.log(`UI updated for state: ${newState}`);
        }
        // --- End Global Scope for Status Logic ---



            // --- End Status Indicator Logic --- (Initial call moved inside DOMContentLoaded)

        // Initialize DOM elements and state
        document.addEventListener('DOMContentLoaded', () => {
            const statusDisplay = document.getElementById('status-display');
            // Assign to globally declared variables
            statusIcon = statusDisplay?.querySelector('.status-icon');
            statusText = statusDisplay?.querySelector('.status-text');
            orbElement = document.querySelector('.orb');
            orbParticles = document.querySelector('.orb-particles');

            // Initial state setup after DOM elements are ready
            updateUIState('idle');
        });
        // Function to simulate audio level input
        function simulateAudioLevel(value) {
            const numValue = parseFloat(value);
            const orb = document.querySelector('.orb');
            const valueDisplay = document.getElementById('audioLevelValue');
            
            // Update the display value
            valueDisplay.textContent = numValue.toFixed(2);
            
            // Set the CSS intensity property
            orb.style.setProperty('--intensity', numValue.toFixed(3));
            
            // Set audio level data attribute based on thresholds
            if (numValue > 0.75) {
                orb.dataset.audioLevel = 'high';
            } else if (numValue > 0.5) {
                orb.dataset.audioLevel = 'medium';
            } else if (numValue > 0.25) {
                orb.dataset.audioLevel = 'low';
            } else {
                delete orb.dataset.audioLevel;
            }
        }
    </script>
</body>
</html>
