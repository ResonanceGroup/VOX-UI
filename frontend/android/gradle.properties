org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Java home is set via environment variable JAVA_HOME or system default
# Windows: Set JAVA_HOME to your Android Studio jbr path (e.g., C:\Program Files\Android\Android Studio\jbr)
# Linux: Set JAVA_HOME to your OpenJDK path (e.g., /usr/lib/jvm/java-17-openjdk-amd64)
