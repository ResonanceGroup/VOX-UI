<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RG Smart Control app.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e" id="theme-color">
  <meta name="apple-mobile-web-app-title" content="RG Smart Control">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RG Smart Control</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --vox-page-bg: #1e1e1e;
      color-scheme: dark light;
    }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--vox-page-bg) !important;
      overscroll-behavior: none;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--vox-page-bg) !important;
    }
    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-scene,
    flt-canvas-container {
      background: var(--vox-page-bg) !important;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
