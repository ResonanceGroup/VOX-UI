name: vox_ui
description: VoxUI - Standalone voice UI application.
publish_to: 'none'

version: 1.0.0+10

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  livekit_client: ^2.5.2
  web_socket_channel: ^3.0.1
  audio_streamer: ^4.0.2
  uuid: ^4.5.1
  webview_flutter: ^4.10.0
  intl: ^0.20.2
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/orb/orb.html
