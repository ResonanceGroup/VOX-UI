<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orb Animation Demo</title>
    <style>
        body {
            background: #10131a;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        body.light {
            background: #f7f7fa;
            color: #222;
        }
        .demo-controls {
            margin: 2rem 0 0 0;
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }
        .theme-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 10;
        }
        .orb-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            min-height: 500px;
            background: radial-gradient(circle at center,
                rgba(64, 206, 224, 0.02) 0%,
                transparent 70%
            );
        }
        .orb {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 20px rgba(64, 206, 224, 0.3));
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: visible;
            border-radius: 50%;
            --intensity: 0;
        }
        .orb::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 260px;
            height: 260px;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle at 25% 25%,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(255, 255, 255, 0.9) 4%,
                rgba(148, 255, 238, 0.5) 8%,
                rgba(64, 206, 224, 0.3) 12%,
                rgba(64, 159, 255, 0.1) 20%,
                transparent 30%
            );
            border-radius: 50%;
            box-shadow:
                inset 0 0 30px rgba(255, 255, 255, 0.4),
                inset 0 0 60px rgba(64, 206, 224, 0.3),
                inset 0 0 100px rgba(95, 89, 255, 0.2);
            z-index: 3;
            backdrop-filter: blur(2px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 260px;
            height: 260px;
            margin: -130px 0 0 -130px;
            animation: rotate 40s infinite linear;
            z-index: 1;
            mix-blend-mode: screen;
            filter: contrast(1.2) saturate(1.2);
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .c {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 220px;
            margin: -110px 0 0 -110px;
            border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%;
            transform-origin: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            mix-blend-mode: plus-lighter;
            opacity: 0.85;
            animation: morph 20s infinite ease-in-out;
            filter: blur(6px) brightness(1.3) contrast(1.4);
        }
        @keyframes morph {
            0%, 100% {
                transform: scale(calc(0.85 + var(--intensity) * 0.15)) translateY(0) rotate(0deg);
                border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%;
                opacity: calc(0.85 + var(--intensity) * 0.15);
            }
            33% {
                transform: scale(calc(1.1 + var(--intensity) * 0.15)) translateY(-15px) rotate(120deg);
                border-radius: 45% 55% 40% 60% / 55% 45% 55% 45%;
                opacity: calc(0.95 + var(--intensity) * 0.05);
            }
            66% {
                transform: scale(calc(0.9 + var(--intensity) * 0.15)) translateY(15px) rotate(240deg);
                border-radius: 55% 45% 60% 40% / 40% 60% 40% 60%;
                opacity: calc(0.75 + var(--intensity) * 0.25);
            }
        }
        .c:nth-child(1) {
            transform: rotate(0deg) translateX(20px);
            animation-delay: -0.0s;
            background: radial-gradient(
                circle at 30% 30%,
                rgba(255, 128, 255, calc(0.8 + var(--intensity) * 0.2)) 0%,
                rgba(128, 0, 255, calc(0.4 + var(--intensity) * 0.2)) 100%
            );
        }
        .c:nth-child(2) {
            transform: rotate(120deg) translateX(-20px);
            animation-delay: -6.7s;
            background: radial-gradient(
                circle at 70% 70%,
                rgba(0, 255, 255, calc(0.7 + var(--intensity) * 0.2)) 0%,
                rgba(0, 128, 255, calc(0.4 + var(--intensity) * 0.2)) 100%
            );
        }
        .c:nth-child(3) {
            transform: rotate(240deg) translateY(20px);
            animation-delay: -13.3s;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(255, 255, 128, calc(0.6 + var(--intensity) * 0.2)) 0%,
                rgba(255, 128, 0, calc(0.4 + var(--intensity) * 0.2)) 100%
            );
        }
        .orb-status-effects {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 4;
        }
        .orb-status-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 320px; height: 320px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 4px solid rgba(64, 206, 224, 0.15);
            box-shadow: 0 0 40px 10px rgba(64, 206, 224, 0.08);
            opacity: 0.7;
            animation: orbRingPulse 2.5s infinite;
        }
        @keyframes orbRingPulse {
            0% { box-shadow: 0 0 40px 10px rgba(64, 206, 224, 0.08); opacity: 0.7; }
            50% { box-shadow: 0 0 80px 30px rgba(64, 206, 224, 0.18); opacity: 1; }
            100% { box-shadow: 0 0 40px 10px rgba(64, 206, 224, 0.08); opacity: 0.7; }
        }
        .orb-particles {
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .talk-button, .mute-button {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 2rem;
            background: linear-gradient(90deg, #42a5f5 0%, #29b6f6 100%);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(64, 206, 224, 0.15);
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .talk-button:hover, .mute-button:hover {
            background: linear-gradient(90deg, #29b6f6 0%, #42a5f5 100%);
            box-shadow: 0 4px 16px rgba(64, 206, 224, 0.25);
        }
    </style>
</head>
<body>
    <div class="theme-toggle">
        <label>
            <input type="checkbox" id="themeCheckbox">
            Light Mode
        </label>
    </div>
    <main>
        <div class="orb-container">
            <div class="orb">
                <div class="orb-status-effects">
                    <div class="orb-status-ring"></div>
                    <div class="orb-particles"></div>
                </div>
                <div class="wrap">
                    <div class="c"></div>
                    <div class="c"></div>
                    <div class="c"></div>
                </div>
                <button class="talk-button">Talk</button>
            </div>
            <button class="mute-button" title="Mute microphone">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
                </svg>
            </button>
        </div>
        <div class="demo-controls">
            <button onclick="setOrbState('idle')">Idle</button>
            <button onclick="setOrbState('executing')">Exec</button>
            <button onclick="setOrbState('processing')">Proc</button>
            <button onclick="setOrbState('notifying')">Notify</button>
            <button onclick="setOrbState('disconnected')">Disc</button>
        </div>
    </main>
    <script>
        // Theme toggle logic
        const themeCheckbox = document.getElementById('themeCheckbox');
        function setTheme(light) {
            document.body.classList.toggle('light', light);
        }
        themeCheckbox.addEventListener('change', () => setTheme(themeCheckbox.checked));
        setTheme(false);

        // Orb state logic for demo
        function setOrbState(state) {
            const orb = document.querySelector('.orb');
            // Map states to visual levels/intensity
            const stateMap = {
                idle:      { level: '',        intensity: 0.1 },
                executing: { level: 'high',    intensity: 1.0 },
                processing:{ level: 'medium',  intensity: 0.6 },
                notifying: { level: 'high',    intensity: 1.0 },
                disconnected: { level: '',     intensity: 0.0 }
            };
            const s = stateMap[state] || stateMap['idle'];
            if (s.level) {
                orb.setAttribute('data-audio-level', s.level);
            } else {
                orb.removeAttribute('data-audio-level');
            }
            orb.style.setProperty('--intensity', s.intensity);
        }
        // Set initial state
        setOrbState('idle');
    </script>
</body>
</html>
